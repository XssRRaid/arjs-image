<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
   </head>
  <body>
    <!-- minimal loader shown until image descriptors are loaded. Loading may take a while according to the device computational power -->

    <h1>Hello!</h1>
    <a href="google.com">Google it 7!</a>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.1;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <!-- <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"> -->
        <a-assets>
            <img id="card" src="./8379989.jpg" />
            <a-asset-item id="3dModel" src="./3d.glb"></a-asset-item>
        </a-assets>
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity mindar-image-target="targetIndex: 0">
            <a-plane src="#card" position="0 0 0" height="0.25" width="0.25" rotation="0 0 0" animation="property: position; to: 0 0.4 0;  dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-plane>
            <!-- <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.005 0.005 0.005" src="#3dModel" animation="property: position; to: 0 -0.6 0; dur: 1000; easing: easeInOutQuad; loop: false; dir: alternate"> -->
            <a-link href="www.google.com" title="My Homepage" scale="0.005 0.005 0.005" position="-0.4 0 0">link</a-link>
            <a-gltf-model rotation="0 0 0 " position="0 -0.3 0" scale="0.005 0.005 0.005" src="#3dModel"  animation="property: scale; from: 0 0 0; to: 0.005 0.005 0.005;  dur: 1000; easing: easeInOutQuad; loop: false; dir: alternate">
        </a-entity>
    </a-scene>
  </body>
</html>
