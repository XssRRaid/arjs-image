<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <!-- minimal loader shown until image descriptors are loaded. Loading may take a while according to the device computational power -->

    <h1>Hello!</h1>
    <a href="google.com">Google it 11!</a>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.1;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <!-- <a-scene mindar-image="imageTargetSrc: ./targets.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"> -->
      <a-assets>
        <img id="card" src="./8379989.jpg" />
        <img id="web" src="./web.png" />
        <a-asset-item id="3dModel" src="./3d.glb"></a-asset-item>
      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        raycaster="objects: .clickable"
        cursor="fuse: false"
      ></a-camera>
      <a-entity mindar-image-target="targetIndex: 0" smooth="true">
        <!-- <a-plane src="#card" position="0 0 0" height="0.25" width="0.25" rotation="0 0 0" animation="property: position; to: 0 0.4 0;  dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"></a-plane> -->
        <!-- <a-gltf-model rotation="0 0 0 " position="0 0 0" scale="0.005 0.005 0.005" src="#3dModel" animation="property: position; to: 0 -0.6 0; dur: 1000; easing: easeInOutQuad; loop: false; dir: alternate"> -->
        <a-plane
          src="#card"
          position="0 .4 0"
          height="0.25"
          width="0.25"
          class="clickable"
          redirect-on-click
        >
        </a-plane>

        <a-image id="web-button" class="clickable" src="#web" alpha-test="0.5" position="-0.14 -0.5 0" height="0.15" width="0.15"
        animation="property: scale; to: 1.2 1.2 1.2; dur: 1000; easing: easeInOutQuad; loop: true; dir: alternate"
      ></a-image>

        <!-- <a-gltf-model rotation="0 0 0 " position="0 -0.3 0" scale="0.05 0.05 0.05" src="#3dModel"  animation="property: scale; from: 0 0 0; to: 0.005 0.005 0.005;  dur: 1000; easing: easeInOutQuad; loop: false; dir: alternate"> -->
            <a-text id="text" class="clickable" value="" color="black" align="center" width="2" position="0 -1 0" geometry="primitive:plane; height: 0.1; width: 2;" material="opacity: 0.5"></a-text>
        </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent("redirect-on-click", {
        init: function () {
          this.el.addEventListener("click", () => {
            window.location.href = "https://google.com";
          });
        },
      });

      const webButton = document.querySelector("#web-button");

      webButton.addEventListener('click', function (evt) {
            text.setAttribute("value", "https://softmind.tech");
          currentTab = 'web';
        });

        text.addEventListener('click', function (evt) {
          if (currentTab === 'web') {
            window.location.href="https://softmind.tech";
          }
        });

    </script>
  </body>
</html>
